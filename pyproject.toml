[project]
name = "jobsbot"
version = "0.1.0"
description = "Telegram bot aggregating Python job vacancies (RU market) monetized via banner ads"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "telethon>=1.34,<2",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "selectolax>=0.3,<1",
    "sqlmodel>=0.0.16,<1",
    "aiosqlite>=0.20,<1",
    "greenlet>=3,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
