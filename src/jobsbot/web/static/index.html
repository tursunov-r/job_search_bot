<!doctype html>

  <title>Jobsbot Admin</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🤖 Jobsbot</div>
      <nav id="nav">
